<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>My profile</title>
<style>
    body{
        background-color: lightgray;

    }
    h1{
        border:2px solid black;
        padding: 10px;
        margin:20px;
        border-radius: 10px;
    }

    h2{
        color:green;
    }
    p{
        font-size: 18px;
    }
.intro{
    color:blue
}
#title{
    color:blue;
    text-align: center;
}
.box{
    width: 300px;
    height: 100px;
    border:  2px solid black;
    background-color: lightblue;
    border-radius: 10px;
    padding: 20px;
    margin: 20px auto;
    text-align: center;
}
.box{
    font-size: 20px;
    font-weight: bold;
    color: darkblue;
}
.box:hover{
    background-color: lightgreen;
    transition: 0.3s;
}
.card{
    width: 300px;
    padding: 20px;
    margin: 20px auto;
    border: 2px solid black;
    border-radius: 10px;
    text-align: center;
    background-color: lightblue;
    box-shadow: 0 4px 10px grey;
    transition: 0.3s;
}
.card:hover{
    transform: scale(1.03);
    box-sizing: border-box;
    display: flex;
    gap:10px;
    width: 300px;
    width:80%;
    max-width: 400px;
}
.item{
    background-color: lightblue;
}
.container{
    display: flex;
    gap:10px;
    justify-content: center;
    border:2px solid red;
    align-items: center;
    
    height: 200px;
    width: 100px;
    align-items: center;
    flex-direction: column;
    flex-wrap: wrap;
}
@media (max-width:600px){.card {

    width:80%;
    max-width: 400px;
    padding: 20px;
    margin: 20px auto ;
    border-radius: 10px;
    box-shadow:0 4px 10px gray;
    opacity: 0.8;
}}

</style>



</head>






<body>

     </ul> 

<div class ="box">

    </div>
    <div class=" container">

</html>
